name: Seed & Build MD3Music3
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 拉 MD3Music2 源码（云端，不占手机流量）
        run: |
          curl -sSL -o /tmp/m2.tgz \
            https://codeload.github.com/huanmeng-wx-hm/MD3Music2/tar.gz/refs/heads/rust-local-force
          mkdir -p /tmp/src
          tar -xzf /tmp/m2.tgz -C /tmp/src --strip-components=1

      - name: 摆 48 个接口 dart
        run: |
          S=/tmp/src
          while IFS= read -r p; do
            mkdir -p "lib/$(dirname "$p")"
            cp "$S/lib/$p" "lib/$p"
          done <<'LIST'
          core/build_flags.dart
          core/platform_capabilities.dart
          core/services/diagnostic_logger.dart
          core/services/folder_picker_service.dart
          core/services/online_download_service.dart
          core/services/remote/ftp_client.dart
          core/services/remote/playback_headers.dart
          core/services/remote/remote_download_cache.dart
          core/services/remote/remote_music_scanner.dart
          core/services/remote/remote_storage_config.dart
          core/services/remote/remote_storage_repository.dart
          core/services/remote/webdav_client.dart
          core/utils/app_toast.dart
          core/utils/audio_format_utils.dart
          core/utils/local_lyric_loader.dart
          core/utils/local_media_path.dart
          data/models/album.dart
          data/models/artist.dart
          data/models/dy_cover_models.dart
          data/models/kugou_account.dart
          data/models/music_folder.dart
          data/models/mv_models.dart
          data/models/playlist.dart
          data/models/song.dart
          services/kugou_api/cloud_song_mapper.dart
          services/kugou_api/comment_delete.dart
          services/kugou_api/comment_reply_target.dart
          services/kugou_api/comment_send_result.dart
          services/kugou_api/comment_sort.dart
          services/kugou_api/comment_thread.dart
          services/kugou_api/favorite_list_paging.dart
          services/kugou_api/kugou_api_client.dart
          services/kugou_api/kugou_endpoints.dart
          services/kugou_api/kugou_models.dart
          services/kugou_api/listen_together_api.dart
          services/kugou_api/listen_together_models.dart
          services/kugou_api/lyric_lookup_result.dart
          services/kugou_api/playlist_track_order.dart
          services/kugou_server.dart
          services/local_server_lifecycle.dart
          utils/playlist_song_sort.dart
          widgets/apple_lyrics/models/aux_text_image.dart
          widgets/apple_lyrics/models/lyric_line.dart
          widgets/apple_lyrics/parsers/krc_parser.dart
          widgets/apple_lyrics/parsers/lrc_parser.dart
          widgets/apple_lyrics/parsers/lyric_parser_chain.dart
          widgets/apple_lyrics/parsers/plaintext_parser.dart
          widgets/apple_lyrics/parsers/ttml_parser.dart
          LIST

      - name: 摆 Android 模板 + arm64 的 .so
        run: |
          S=/tmp/src
          mkdir -p android/gradle/wrapper android/app/src/main/jniLibs/arm64-v8a
          cp "$S/android/settings.gradle.kts" android/
          cp "$S/android/build.gradle.kts" android/
          cp "$S/android/gradle.properties" android/
          cp "$S/android/gradle/wrapper/"* android/gradle/wrapper/
          cp "$S/android/gradlew" "$S/android/gradlew.bat" ./
          chmod +x gradlew
          cp "$S/LICENSE" ./
          # 删掉 Windows 本地 SDK 路径，避免 CI 上误读
          sed -i '/android.sdk.dir/d' android/gradle.properties
          # 换官方 Gradle 源（原配置是国内镜像，海外 runner 上不稳）
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' \
            android/gradle/wrapper/gradle-wrapper.properties
          # 只留 arm64：release 只打 arm64，省 13 MB
          cp "$S/android/app/src/main/jniLibs/arm64-v8a/libkugou_server.so" \
            android/app/src/main/jniLibs/arm64-v8a/
          # res 最小集：主题 + 启动屏背景，旧图标/小组件资源一个不拷
          for d in values values-night values-v27 values-night-v27; do
            mkdir -p "android/app/src/main/res/$d"
            cp "$S/android/app/src/main/res/$d/styles.xml" "android/app/src/main/res/$d/"
          done
          mkdir -p android/app/src/main/res/drawable
          cp "$S/android/app/src/main/res/drawable/launch_background.xml" \
            android/app/src/main/res/drawable/

