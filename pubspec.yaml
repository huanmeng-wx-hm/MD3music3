name: md3music
description: "MD3Music3 - 轻量下载播放器（从零重建版）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  just_audio: ^0.10.6
  audio_session: ^0.1.18
  provider: ^6.1.2

  dio: ^5.4.0
  http: ^1.2.1
  crypto: ^3.0.3
  ffi: ^2.1.0
  intl: ^0.20.2
  path_provider: ^2.1.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^10.3.1
  fluttertoast: ^10.0.0
  file_selector: ^1.0.2
  audio_metadata_reader: ^1.4.1
  pinyin: ^3.2.0
  xml: ^6.5.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
