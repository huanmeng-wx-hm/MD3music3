name: md3music
description: "MD3Music3 - 轻量下载播放器（从零重建版）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 原仓用本地 fork（path: third_party/just_audio，自标 0.10.6）。
  # pub.dev 上不一定有 0.10.6，写死 ^0.10.6 会让 pub get 直接无解；
  # 放宽成区间，让 pub 自己挑可用的最高版，基础 API 全兼容。
  just_audio: '>=0.9.38 <0.11.0'
  audio_session: ^0.1.18
  provider: ^6.1.2

  dio: ^5.4.0
  http: ^1.2.1
  crypto: ^3.0.3
  ffi: ^2.1.0
  intl: ^0.20.2
  path_provider: ^2.1.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^10.3.1
  fluttertoast: ^10.0.0
  file_selector: ^1.1.0
  audio_metadata_reader: ^1.4.1
  pinyin: ^3.3.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
